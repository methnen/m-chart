name: JS Tests

on:
  push:
    branches: [ main ]
  pull_request:
  # Run by hand against any branch from the Actions tab
  workflow_dispatch:
  # Run by the deploy workflow as its gate
  workflow_call:

# A new push to a pull request replaces the run before it, nothing else is ever cancelled
# The name is spelled out because github.workflow is the caller's name when the deploy workflow runs this
concurrency:
  group: js-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Required for the test reporter to post check results, PR comments, and source-line annotations
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  jest:
    name: "Jest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Jest runs the source, so skip the asset build that postinstall would run
      - run: npm ci --ignore-scripts

      - name: Run Jest with coverage
        run: npm run test:js:coverage -- --ci

      - name: Upload Jest JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-junit
          path: tests/junit/jest.xml
          retention-days: 7

      - name: Upload Jest coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 7

      - name: Publish Jest test results
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: tests/junit/jest.xml
          check_name: Jest
          require_tests: false
          fail_on_failure: true
          detailed_summary: true

      - name: Upload Jest coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          flags: js
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: "ESLint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      # Scope lint to source directories only — `components/` also contains
      # compiled webpack output (admin-ui/, block/) and vendored libraries
      # (external/chartjs, jspreadsheet, jsuites, parsecsv) which would hang
      # ESLint on multi-MB minified bundles.
      - run: npm run lint:js
