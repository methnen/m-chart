name: E2E Tests

on:
  push:
    branches: [ main, wordpress-7, pro-support ]
  pull_request:
  schedule:
    # Nightly run with the full browser matrix
    - cron: '0 6 * * *'

# Required for the test reporter to post check results, PR comments, and source-line annotations
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  playwright:
    name: "Playwright (${{ matrix.browser }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Push and PR events run chromium only; the nightly schedule runs the
        # full browser matrix. Jspreadsheet has historical browser quirks so
        # cross-browser coverage stays in the rotation, just nightly. The
        # matrix list itself is event-conditional via fromJSON — GitHub
        # Actions doesn't reliably support `matrix.*` in job-level `if:`,
        # so we shape the matrix at workflow-eval time instead.
        browser: ${{ github.event_name == 'schedule' && fromJSON('["chromium","firefox","webkit"]') || fromJSON('["chromium"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build assets
        run: npm run build

      - name: Start wp-env
        # Plugin activation and pretty permalinks happen in the afterStart
        # lifecycle script in .wp-env.json so local runs and CI stay identical
        run: npx wp-env start

      - name: Run E2E tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-${{ matrix.browser }}
          path: tests/junit/playwright.xml
          retention-days: 7

      - name: Upload Playwright test traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Publish Playwright test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: tests/junit/playwright.xml
          check_name: Playwright (${{ matrix.browser }})
          require_tests: false
          fail_on_failure: true
          detailed_summary: true
