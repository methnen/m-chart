name: PHP Tests

on:
  push:
    branches: [ main, wordpress-7, pro-support ]
  pull_request:

# Required for the test reporter to post check results, PR comments, and source-line annotations
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  php-unit:
    name: "Unit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Run PHP unit tests
        run: |
          mkdir -p tests/junit
          vendor/bin/phpunit --testsuite unit --log-junit tests/junit/phpunit-unit.xml

      - name: Upload PHPUnit JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-unit-junit-php${{ matrix.php }}
          path: tests/junit/phpunit-unit.xml
          retention-days: 7

      - name: Publish unit-test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: tests/junit/phpunit-unit.xml
          check_name: PHP Unit (PHP ${{ matrix.php }})
          require_tests: false
          fail_on_failure: true
          detailed_summary: true

  php-integration:
    name: "Integration (PHP ${{ matrix.php }} × WP ${{ matrix.wp }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
        wp:  [ '6.8', '7.0' ]
        include:
          - { php: '8.3', wp: 'trunk' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          # Tests run inside the wp-env container, so host xdebug is never
          # needed — container coverage is enabled via --xdebug below
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Start wp-env
        # Note: 'trunk' in the matrix maps to the WordPress/WordPress repo's
        # `master` branch, which is the auto-synced mirror of SVN trunk. The
        # GitHub mirror has no Git branch literally named `trunk`.
        # Plugin activation and pretty permalinks happen in the afterStart
        # lifecycle script in .wp-env.json so local runs and CI stay identical.
        # The coverage cell starts with xdebug in coverage mode inside the
        # container so phpunit can produce the clover report.
        run: npx wp-env start ${{ matrix.php == '8.3' && matrix.wp == '7.0' && '--xdebug=coverage' || '' }}
        env:
          WP_ENV_CORE: ${{ matrix.wp == 'trunk' && 'WordPress/WordPress#master' || format('WordPress/WordPress#{0}', matrix.wp) }}
          WP_ENV_PHP_VERSION: ${{ matrix.php }}

      - name: Run integration tests
        run: |
          mkdir -p tests/junit
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/m-chart \
            vendor/bin/phpunit --testsuite integration \
            --log-junit tests/junit/phpunit-integration.xml \
            ${{ matrix.php == '8.3' && matrix.wp == '7.0' && '--coverage-clover coverage.xml' || '' }}

      - name: Upload PHPUnit JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-integration-junit-php${{ matrix.php }}-wp${{ matrix.wp }}
          path: tests/junit/phpunit-integration.xml
          retention-days: 7

      - name: Publish integration-test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: tests/junit/phpunit-integration.xml
          check_name: PHP Integration (PHP ${{ matrix.php }} × WP ${{ matrix.wp }})
          require_tests: false
          fail_on_failure: true
          detailed_summary: true

      - name: Upload coverage
        if: matrix.php == '8.3' && matrix.wp == '7.0'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: php-integration
          fail_ci_if_error: false
