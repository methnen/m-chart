name: Deploy to WordPress.org

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and prepare the release, commit nothing to WordPress.org)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The gate: every suite that runs on a pull request, run again on exactly what is about to ship
  # A deploy is rare, a few minutes of waiting is cheap insurance against shipping a red tree
  php:
    name: PHP tests
    uses: ./.github/workflows/test-php.yml
    permissions:
      checks: write
      contents: read
      pull-requests: write

  js:
    name: JS tests
    uses: ./.github/workflows/test-js.yml
    permissions:
      checks: write
      contents: read
      pull-requests: write

  e2e:
    name: E2E tests
    uses: ./.github/workflows/test-e2e.yml
    permissions:
      checks: write
      contents: read
      pull-requests: write

  package:
    name: Package
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read

  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    needs: [ php, js, e2e, package ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # VersionConsistencyTest in the unit suite has already checked this matches m-chart.php and the main class
      - name: Read version from readme.txt
        id: readme_version
        run: |
          VERSION=$(grep -m1 "^Stable tag:" readme.txt | sed 's/Stable tag: *//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci for a reproducible install from package-lock.json
      # Dependencies' own install scripts are not run, nothing here needs them
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build assets
        run: npm run build

      - name: Deploy to WordPress.org
        # Pinned to a commit because this step is handed the WordPress.org SVN credentials
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ inputs.dry_run }}
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: m-chart
          ASSETS_DIR: assets
          VERSION: ${{ steps.readme_version.outputs.version }}
